[workspace]
members = [
  "apps/control",
  "apps/desktop/src-tauri",
  "crates/api",
  "crates/browser",
  "crates/control",
  "crates/domain",
  "crates/network",
  "crates/storage",
  "crates/sync",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.95"
version = "3.0.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `Problem` is the shared serialized HTTP error envelope; its size is part of
# the existing public contract and is returned directly throughout the domain.
result_large_err = "allow"
