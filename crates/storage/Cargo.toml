[package]
name = "buglogin-storage"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
buglogin-domain = { path = "../domain" }
http = { version = "1.3", optional = true }
native-tls = { version = "0.2.18", optional = true }
postgres = { version = "0.19.14", features = ["with-serde_json-1"], optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync-rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
url = "2.5.8"
zeroize = "1.9"

[features]
default = ["production-adapters"]
integration-tests = ["production-adapters"]
production-adapters = [
  "dep:http",
  "dep:native-tls",
  "dep:postgres",
  "dep:postgres-native-tls",
  "dep:rust-s3",
]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
