[package]
name = "buglogin-migration"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
buglogin-domain = { path = "../domain" }
buglogin-storage = { path = "../storage" }
buglogin-sync = { path = "../sync" }
blake3 = "1.8.3"
getrandom = "0.3.4"
hex = "0.4.3"
s3 = { package = "rust-s3", version = "0.37.2", default-features = false, features = ["sync-rustls-tls"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["serde", "v5"] }
url = "2.5"
percent-encoding = "2.3"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
time = { version = "0.3.54", features = ["formatting"] }
unicode-normalization = "0.1.25"
zeroize = { version = "1.8", features = ["derive"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "buglogin-migrate"
path = "src/bin/buglogin-migrate.rs"
