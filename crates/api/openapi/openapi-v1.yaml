        - { name: x-buglogin-owner-token, in: header, required: true, schema: { type: string } }
        - { name: x-buglogin-fencing-token, in: header, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Whether the encrypted blob is already staged, content: { application/json: { schema: { $ref: '#/components/schemas/BlobPresence' } } } }
        "409": { $ref: '#/components/responses/Problem' }
