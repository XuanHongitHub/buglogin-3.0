        "404": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/cookie-jobs/{jobId}/fail:
    post:
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FailCookieJobInput' } } } }
      responses:
        "200": { description: Persisted redacted device failure and terminal job state, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectedCookieJob' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
