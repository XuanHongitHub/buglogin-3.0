openapi: 3.1.0
info:
  title: BugLogin REST API
  version: 1.0.0
  description: Versioned Rust control, authentication, and sync API.
servers:
  - url: https://api3.buglogin.com
security:
  - bearerAuth: []
tags:
  - name: system
  - name: profiles
  - name: migration
  - name: runtime
paths:
  /v1/health:
    get:
      operationId: system.health.get
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /v1/openapi.yaml:
    get:
      security: []
      responses:
        "200": { description: Canonical BugLogin v1 OpenAPI document, content: { application/yaml: { schema: { type: string } } } }
  /v1/readyz:
    get:
      security: []
      responses:
        "200": { description: Required service dependencies are ready; runtime catalog status is reported separately, headers: { X-BugLogin-Runtime-Catalog: { schema: { type: string, enum: [available, unavailable] } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/runtime/catalog:
    get:
      operationId: runtime.catalog.get
      tags: [runtime]
      security: []
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string, maxLength: 256 } }
      responses:
        "200": { description: Validated signed runtime catalog, headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCatalog' } } } }
        "304": { description: Runtime catalog is unchanged, headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string } } } }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/start:
    post:
      operationId: auth.device.start
      description: JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationStartInput' } } } }
      responses:
        "200": { description: Device authorization started, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationStartResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      operationId: auth.login
      description: JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      security: []
      parameters: [{ $ref: '#/components/parameters/WebOriginRequired' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebLoginInput' } } } }
      responses:
        "200": { description: Browser session established; session is returned only as Secure HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/desktop/login:
    post:
      operationId: auth.desktop.login
      description: Authenticates a native desktop account and issues device-bound access and refresh credentials. The refresh credential must be stored only in the operating-system credential vault. JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DesktopLoginInput' } } } }
      responses:
        "200": { description: Device-bound session established, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthTokenResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "500": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/sso/buglab/start:
    post:
      operationId: auth.sso.buglab.start
      description: Starts a five-minute BugLab ID authorization transaction. The raw state is sent only to the configured provider authorization URL and stored server-side as a hash. Returns 503 when BugLab SSO is not configured.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BugLabSsoStartInput' } } } }
      responses:
        "200": { description: Authorization URL to open in the system browser, content: { application/json: { schema: { $ref: '#/components/schemas/BugLabSsoStartResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/sso/buglab/complete:
    post:
      operationId: auth.sso.buglab.complete
      description: Exchanges a provider callback token server-side. The state is single-use, expires after five minutes, and is bound to the starting desktop device. Issues the normal device-bound BugLogin session.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BugLabSsoCompleteInput' } } } }
      responses:
        "200": { description: Device-bound access and refresh credentials, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthTokenResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/api-tokens:
    get:
      operationId: auth.api.tokens.list
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200": { description: Safe API token inventory, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenPage' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
    post:
      operationId: auth.api.token.create
      description: JSON request body is limited to 8 KiB at the Rust HTTP boundary. Cookie-authenticated requests require the web origin and CSRF headers; bearer-authenticated desktop requests do not.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreateInput' } } } }
      responses:
        "201": { description: Raw token returned once, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreated' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/api-tokens/{tokenId}:
    delete:
      operationId: auth.api.token.revoke
      description: Cookie-authenticated requests require the web origin and CSRF headers; bearer-authenticated desktop requests do not.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ApiTokenId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        "204": { description: API token revoked }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/recovery/request:
    post:
      operationId: auth.recovery.request
      description: JSON request body is limited to 8 KiB. Returns 503 until recovery delivery is configured; no recovery token is issued while delivery is unavailable.
      security: []
      parameters: [{ $ref: '#/components/parameters/WebOriginRequired' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequestInput' } } } }
      responses:
        "202": { description: Recovery request accepted with enumeration-safe response }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/recovery/complete:
    post:
      operationId: auth.recovery.complete
      description: JSON request body is limited to 8 KiB. Returns 503 until recovery delivery is configured.
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCompleteInput' } } } }
      responses:
        "204": { description: Password reset; recovery token consumed; existing sessions revoked }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/session:
    get:
      operationId: auth.session
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current browser session, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions:
    get:
      operationId: auth.sessions.list
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current account sessions, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionPage' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: auth.sessions.revoke
      description: Revokes an account-owned session. For device-bound sessions with a current encrypted-profile key envelope, BugLogin persists rotation-pending fences before revoking the session; if fencing fails, the session remains active.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/WebOriginConditional' }
        - { name: X-CSRF-Token, in: header, required: false, description: Required when authenticating with the browser session cookie., schema: { type: string, minLength: 1 } }
      responses:
        "204": { description: Session revoked }
        "409": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/approve:
    post:
      operationId: auth.device.approve
      description: Repeating approval is safe only for the same authenticated account and credential version. A different account receives a conflict. JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WebOriginConditional' }
        - { name: X-CSRF-Token, in: header, required: false, description: Required when authenticating with the browser session cookie., schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationApproveInput' } } } }
      responses:
        "200": { description: Device authorization approved, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationApproveResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/token:
    post:
      operationId: auth.device.token
      description: The approved device code is consumed only after the access and refresh session is durably issued. If the exchange response is lost, restart device authorization; the code is single-use and this operation is not replayable. A slow_down Problem includes fields.retryAfterSeconds, which clients must use for the next poll. JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationTokenInput' } } } }
      responses:
        "200": { description: Device-bound access and refresh credentials, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthTokenResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/refresh:
    post:
      operationId: auth.device.refresh
      description: "Rotates a device-bound bearer/refresh pair; the replacement refresh token keeps the original absolute expiry. An optional Idempotency-Key (16-128 ASCII characters) lets a retry with the same key replay the exact response for 5 minutes after rotation. Reuse with a different key, or without a key, revokes the device session family. JSON request body is limited to 8 KiB at the Rust HTTP boundary."
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 16, maxLength: 128 } }
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRefreshInput' } } } }
      responses:
        "200": { description: Rotated device access and refresh credentials, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthTokenResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/encryption-key:
    put:
      operationId: auth.device.encryptionkey.register
      description: Registers the current authenticated device's HPKE public key. The private key must remain in that device's OS vault. JSON request body is limited to 8 KiB at the Rust HTTP boundary.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceEncryptionKeyRegistrationInput' } } } }
      responses:
        "200": { description: Registered device key, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceEncryptionKey' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/refresh:
    post:
      operationId: auth.refresh
      description: "Rotates a bearer token. An optional Idempotency-Key (16-128 ASCII characters) lets a retry with the same key replay the exact response for 5 minutes after rotation. Reuse with a different key, or without a key, revokes the token family."
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 16, maxLength: 128 } }
      responses:
        "200": { description: Rotated bearer session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: auth.logout
      description: Revokes the current bearer or browser session. Browser-cookie requests must include an allowlisted Origin and the CSRF header.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/WebOriginConditional' }
        - { name: X-CSRF-Token, in: header, required: false, schema: { type: string, minLength: 1 } }
      responses:
        "204": { description: Bearer session revoked }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/proxies/parse:
    post:
      operationId: proxy.parse
      requestBody: { required: true, content: { text/plain: { schema: { $ref: '#/components/schemas/ProxyParseInput' } } } }
      responses:
        "200": { description: Parsed proxy report, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyParseReport' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/proxies:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: proxy.list
      responses: { "200": { description: Workspace proxy inventory, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyPage' } } } } }
    post:
      operationId: proxy.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyCreateInput' } } } }
      responses: { "200": { description: Created or deduplicated proxy, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyCreateResult' } } } } }
  /v1/workspaces/{workspaceId}/proxies/{proxyId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ProxyId' }
    get:
      operationId: proxy.get
      responses: { "200": { description: Proxy metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } } }
    patch:
      operationId: proxy.update
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyUpdateInput' } } } }
      responses:
        "200": { description: Updated proxy metadata; update is rejected while a profile is running on or has a pending assignment for this proxy, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } }
        "409": { $ref: '#/components/responses/Problem' }
    delete:
      operationId: proxy.delete
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyDeleteInput' } } } }
      responses: { "200": { description: Deleted proxy metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } } }
  /v1/profiles:
    get:
      operationId: profile.list
      description: Rejects repeated or unsupported query parameters and returns canonical Problem responses for malformed values.
      parameters:
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { $ref: '#/components/parameters/WorkspaceIdFilter' }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Versioned profile page, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedProfilePage' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
    post:
      operationId: profile.create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCreateInput' } } } }
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "201": { description: Profile created, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedProfile' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/profiles/{profileId}:
    get:
      operationId: profile.get
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: { "200": { description: Versioned profile, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedProfile' } } } }, "404": { $ref: '#/components/responses/Problem' } }
    delete:
      operationId: profile.delete
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileDeleteBody' } } } }
      responses: { "200": { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/binding:
    get:
      operationId: profile.binding.get
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: { "200": { description: Profile resource binding, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileResource' } } } }, "404": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/archive:
    put:
      operationId: profile.archive
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRevisionBody' } } } }
      responses: { "200": { description: Versioned archived profile, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedProfile' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/restore:
    put:
      operationId: profile.restore
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRevisionBody' } } } }
      responses: { "200": { description: Versioned restored profile, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedProfile' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/launch:
    post:
      operationId: profile.launch
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileLaunchInput' } } } }
      responses: { "202": { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/clone:
    post:
      operationId: profile.clone
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCloneInput' } } } }
      responses: { "200": { description: Metadata-only clone, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCloneReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/shares:
    post:
      operationId: profile.share
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareInput' } } } }
      responses: { "200": { description: Profile share, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' }, "503": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/shares/{memberId}:
    delete:
      operationId: profile.share.revoke
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/MemberId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareRevokeInput' } } } }
      responses: { "200": { description: Profile share revocation, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareRevocationReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/shares/{memberId}/device-keys:
    get:
      operationId: profile.share.recipientdevicekeys.list
      description: Lists registered device public keys for an active workspace member, after profile-share authorization. Expired or revoked device sessions are excluded.
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
        - { $ref: '#/components/parameters/MemberId' }
      responses:
        "200": { description: Active recipient device public keys, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceEncryptionKeyList' } } } }
        "403": { $ref: '#/components/responses/Problem' }
