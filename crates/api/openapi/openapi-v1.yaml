        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "422": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/migrations/sync/import:
    post:
      operationId: migration.sync.import
      description: Refreshes authorization before preflight and again after acquiring the destination lease. The API rechecks the actor, migration ACL, active profile-resource binding, and proxy dependencies before writing blobs; import planning uses the PostgreSQL-backed current manifest.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        description: Direct JSON imports are limited to 320 MiB, with one import admitted per API process and a shared two-slot body-transfer budget across sync imports, profile blobs, and migration package files. Saturation returns a retryable 503; use staged migration-package upload for larger exports.
        content: { application/json: { schema: { $ref: '#/components/schemas/SyncImportInput' } } }
      responses:
        "200": { description: Hosted sync import receipt, content: { application/json: { schema: { $ref: '#/components/schemas/SyncImportReceipt' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "415": { $ref: '#/components/responses/Problem' }
        "422": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/migrations/packages/{packageId}/files:
    put:
      operationId: migration.package.file.put
      parameters:
        - { $ref: '#/components/parameters/MigrationPackageId' }
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: x-content-sha256, in: header, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, description: "Each staged file is limited to 67108864 bytes; each package is limited to 67108864 bytes total and 10000 files, enforced before staging each new file. Browser payloads use encrypted profile sync, not migration packages.", content: { application/octet-stream: { schema: { type: string, format: binary, maxLength: 67108864 } } } }
      responses: { "200": { description: Staged migration package file, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageFileReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' }, "413": { $ref: '#/components/responses/Problem' }, "415": { $ref: '#/components/responses/Problem' }, "503": { $ref: '#/components/responses/Problem', description: The shared two-slot large-transfer budget is full; retry the request } }
  /v1/migrations/packages/{packageId}/verify:
    post:
      operationId: migration.package.verify
      parameters:
        - { $ref: '#/components/parameters/MigrationPackageId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { "200": { description: Verified staged migration package, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageVerifyReceipt' } } } }, "401": { $ref: '#/components/responses/Problem' }, "403": { $ref: '#/components/responses/Problem' }, "404": { $ref: '#/components/responses/Problem' }, "409": { $ref: '#/components/responses/Problem' }, "413": { $ref: '#/components/responses/Problem', description: Package exceeds the 64 MiB or 10,000-file limit }, "503": { $ref: '#/components/responses/Problem' } }
  /v1/migrations/packages/{packageId}/activate:
    post:
      operationId: migration.package.activate
      parameters:
        - { $ref: '#/components/parameters/MigrationPackageId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { "200": { description: Activated migration package, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageActivationReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }

