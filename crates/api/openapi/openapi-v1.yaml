openapi: 3.1.0
info:
  title: BugLogin REST API
  version: 1.0.0
  description: Versioned Rust control, authentication, and sync API.
servers:
  - url: https://api.buglogin.com
security:
  - bearerAuth: []
tags:
  - name: system
  - name: profiles
  - name: migration
paths:
  /v1/health:
    get:
      operationId: system.health.get
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /v1/readyz:
    get:
      security: []
      responses:
        "200": { description: Required service dependencies are ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/start:
    post:
      operationId: auth.device.start
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationStartInput' } } } }
      responses:
        "200": { description: Device authorization started, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationStartResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      operationId: auth.login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebLoginInput' } } } }
      responses:
        "200": { description: Browser session established; session is returned only as Secure HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
  /v1/auth/api-tokens:
    get:
      operationId: auth.api.tokens.list
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Safe API token inventory, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenPage' } } } }
        "401": { $ref: '#/components/responses/Problem' }
    post:
      operationId: auth.api.token.create
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreateInput' } } } }
      responses:
        "201": { description: Raw token returned once, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreated' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
  /v1/auth/api-tokens/{tokenId}:
    delete:
      operationId: auth.api.token.revoke
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "204": { description: API token revoked }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
  /v1/auth/recovery/request:
    post:
      operationId: auth.recovery.request
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequestInput' } } } }
      responses:
        "202": { description: Recovery request accepted with enumeration-safe response }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/auth/recovery/complete:
    post:
      operationId: auth.recovery.complete
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCompleteInput' } } } }
      responses:
        "204": { description: Password reset; recovery token consumed; existing sessions revoked }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
  /v1/auth/session:
    get:
      operationId: auth.session
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current browser session, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions:
    get:
      operationId: auth.sessions.list
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current account sessions, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionPage' } } } }
        "401": { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: auth.sessions.revoke
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "204": { description: Session revoked }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/approve:
    post:
      operationId: auth.device.approve
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationApproveInput' } } } }
      responses:
        "200": { description: Device authorization approved, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationApproveResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/auth/device/token:
    post:
      operationId: auth.device.token
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceAuthorizationTokenInput' } } } }
      responses:
        "200": { description: Device-bound bearer session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        "400": { $ref: '#/components/responses/Problem' }
  /v1/auth/refresh:
    post:
      operationId: auth.refresh
      description: Reuse of a rotated bearer token revokes the token family.
      responses:
        "200": { description: Rotated bearer session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        "401": { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      operationId: auth.logout
      responses:
        "204": { description: Bearer session revoked }
        "401": { $ref: '#/components/responses/Problem' }
  /v1/proxies/parse:
    post:
      operationId: proxy.parse
      requestBody: { required: true, content: { text/plain: { schema: { $ref: '#/components/schemas/ProxyParseInput' } } } }
      responses:
        "200": { description: Parsed proxy report, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyParseReport' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/proxies:
    parameters: [{ name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }]
    get:
      operationId: proxy.list
      responses: { "200": { description: Workspace proxy inventory, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyPage' } } } } }
    post:
      operationId: proxy.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyCreateInput' } } } }
      responses: { "200": { description: Created or deduplicated proxy, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyCreateResult' } } } } }
  /v1/workspaces/{workspaceId}/proxies/{proxyId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: proxyId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: proxy.get
      responses: { "200": { description: Proxy metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } } }
    patch:
      operationId: proxy.update
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyUpdateInput' } } } }
      responses: { "200": { description: Updated proxy metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } } }
    delete:
      operationId: proxy.delete
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyDeleteInput' } } } }
      responses: { "200": { description: Deleted proxy metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ProxyRecord' } } } } }
  /v1/profiles:
    get:
      operationId: profile.list
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Profile page, content: { application/json: { schema: { $ref: '#/components/schemas/ProfilePage' } } } }
    post:
      operationId: profile.create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCreateInput' } } } }
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "202": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CommandResult' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/profiles/{profileId}:
    get:
      operationId: profile.get
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: { "200": { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, "404": { $ref: '#/components/responses/Problem' } }
    delete:
      operationId: profile.delete
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/archive:
    put:
      operationId: profile.archive
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Archived profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/restore:
    put:
      operationId: profile.restore
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Restored profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/launch:
    post:
      operationId: profile.launch
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileLaunchInput' } } } }
      responses: { "202": { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/clone:
    post:
      operationId: profile.clone
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCloneInput' } } } }
      responses: { "200": { description: Metadata-only clone, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCloneReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/shares:
    post:
      operationId: profile.share
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareInput' } } } }
      responses: { "200": { description: Profile share, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/shares/{memberId}:
    delete:
      operationId: profile.share.revoke
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { name: memberId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareRevokeInput' } } } }
      responses: { "200": { description: Profile share revocation, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileShareRevocationReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/stop:
    post:
      operationId: profile.stop
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "202": { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/cookies:
    get:
      operationId: cookie.list
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
        - { name: workspaceId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses: { "200": { description: Cookie metadata only, content: { application/json: { schema: { $ref: '#/components/schemas/CookieListResult' } } } }, "403": { $ref: '#/components/responses/Problem' }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/cookies/stage:
    post:
      operationId: cookie.stage
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CookieStageInput' } } } }
      responses: { "200": { description: One-use staged cookie reference, content: { application/json: { schema: { $ref: '#/components/schemas/CookieStageReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/cookies/import:
    post:
      operationId: cookie.import
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CookieImportInput' } } } }
      responses: { "200": { description: Cookie mutation receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CookieMutationResult' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/cookies/copy:
    post:
      operationId: cookie.copy
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CookieCopyInput' } } } }
      responses: { "200": { description: Cookie copy receipt, content: { application/json: { schema: { $ref: '#/components/schemas/CookieMutationResult' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/runtime:
    get:
      operationId: profile.runtime.get
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: { "200": { description: Runtime projection, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeProjection' } } } } }
  /v1/profiles/{profileId}/runtime/started:
    put:
      operationId: profile.runtime.started
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeProjectionInput' } } } }
      responses: { "200": { description: Started runtime projection, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeProjection' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/profiles/{profileId}/runtime/stopped:
    put:
      operationId: profile.runtime.stopped
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeProjectionInput' } } } }
      responses: { "200": { description: Stopped runtime projection, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeProjection' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/operations/{operationId}:
    get:
      operationId: operation.get
      parameters: [{ name: operationId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Operation state, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } } }
  /v1/events:
    get:
      operationId: events.stream
      description: Server-sent events; reconnect with Last-Event-ID. Events are at-least-once.
      responses: { "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } } }
  /v1/migrations/inspect:
    post:
      operationId: migration.inspect
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationInspectInput' } } } }
      responses: { "202": { description: Migration inspection operation, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } } }
  /v1/migrations/import:
    post:
      operationId: migration.import
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationImportInput' } } } }
      responses: { "202": { description: Migration import operation, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } } }
  /v1/migrations/sync/import:
    post:
      operationId: migration.sync.import
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Hosted sync import receipt } }
  /v1/migrations/packages/{packageId}/files:
    put:
      operationId: migration.package.file.put
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: x-content-sha256, in: header, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { "200": { description: Staged migration package file, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageFileReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/migrations/packages/{packageId}/verify:
    post:
      operationId: migration.package.verify
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { "200": { description: Verified staged migration package, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageVerifyReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/migrations/packages/{packageId}/activate:
    post:
      operationId: migration.package.activate
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { "200": { description: Activated migration package, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPackageActivationReceipt' } } } }, "409": { $ref: '#/components/responses/Problem' } }

  /v1/account:
    get:
      operationId: account.get
      responses: { "200": { description: Account } }
  /v1/organizations:
    get:
      operationId: organization.list
      responses: { "200": { description: Organizations } }
    post:
      operationId: organization.create
      responses: { "201": { description: Organization } }
  /v1/organizations/{organizationId}:
    get:
      operationId: organization.get
      responses: { "200": { description: Organization } }
    patch:
      operationId: organization.update
      responses: { "200": { description: Organization } }
  /v1/organizations/{organizationId}/workspaces:
    get:
      operationId: workspace.list
      responses: { "200": { description: Workspaces } }
    post:
      operationId: workspace.create
      responses: { "201": { description: Workspace } }
  /v1/organizations/{organizationId}/workspaces/{workspaceId}:
    get:
      operationId: workspace.get
      responses: { "200": { description: Workspace } }
    patch:
      operationId: workspace.update
      responses: { "200": { description: Workspace } }
  /v1/workspaces/{workspaceId}/teams:
    get:
      operationId: team.list
      responses: { "200": { description: Teams } }
    post:
      operationId: team.create
      responses: { "201": { description: Team } }
  /v1/workspaces/{workspaceId}/teams/{teamId}:
    get:
      operationId: team.get
      responses: { "200": { description: Team } }
    patch:
      operationId: team.update
      responses: { "200": { description: Team } }
  /v1/workspaces/{workspaceId}/members:
    get:
      operationId: member.list
      responses: { "200": { description: Members } }
    post:
      operationId: member.invite
      responses: { "202": { description: Member invitation } }
  /v1/workspaces/{workspaceId}/members/{memberId}:
    get:
      operationId: member.get
      responses: { "200": { description: Member } }
  /v1/workspaces/{workspaceId}/members/{memberId}/activate:
    post:
      operationId: member.activate
      responses: { "200": { description: Activated member } }
  /v1/workspaces/{workspaceId}/members/{memberId}/suspend:
    post:
      operationId: member.suspend
      responses: { "200": { description: Suspended member } }
  /v1/workspaces/{workspaceId}/members/{memberId}/role:
    patch:
      operationId: member.role.update
      responses: { "200": { description: Updated member role } }
  /v1/workspaces/{workspaceId}/resources:
    get:
      operationId: resource.list
      responses: { "200": { description: Resources } }
    post:
      operationId: resource.register
      responses: { "201": { description: Resource } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}:
    get:
      operationId: resource.get
      responses: { "200": { description: Resource } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/lease:
    post:
      operationId: resource.lease.acquire
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Lease grant } }
    put:
      operationId: resource.lease.renew
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Renewed lease } }
    delete:
      operationId: resource.lease.release
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Released lease } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/manifest:
    get:
      operationId: profile.manifest.get
      responses: { "200": { description: Current durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/OptionalSyncManifest' } } } } }
    put:
      operationId: profile.manifest.commit
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncManifest' }
      responses:
        "200": { description: Committed durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/SyncManifest' } } } }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/blobs:
    get:
      operationId: profile.blob.get
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: Verified immutable profile blob } }
    put:
      operationId: profile.blob.put
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: key, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "200": { description: Verified immutable blob receipt }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/blobs/check:
    get:
      operationId: profile.blob.check
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: checksum, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: x-buglogin-owner-id, in: header, required: true, schema: { type: string } }
        - { name: x-buglogin-owner-token, in: header, required: true, schema: { type: string } }
        - { name: x-buglogin-fencing-token, in: header, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Whether the encrypted blob is already staged, content: { application/json: { schema: { $ref: '#/components/schemas/BlobPresence' } } } }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/grants:
    get:
      operationId: grant.list
      responses: { "200": { description: Grants } }
    post:
      operationId: grant.create
      responses: { "201": { description: Grant } }
  /v1/workspaces/{workspaceId}/grants/{grantId}:
    delete:
      operationId: grant.revoke
      responses: { "200": { description: Revoked grant } }
