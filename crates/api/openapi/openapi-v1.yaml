        - { $ref: '#/components/parameters/ResourceIdQuery' }
        - { $ref: '#/components/parameters/MemberIdQuery' }
        - { name: cursor, in: query, required: false, schema: { $ref: '#/components/schemas/CanonicalId' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Bounded workspace grant page, content: { application/json: { schema: { $ref: '#/components/schemas/GrantPage' } } } }
