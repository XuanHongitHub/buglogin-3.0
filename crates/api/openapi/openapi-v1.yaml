      operationId: resource.get
      responses: { "200": { description: Resource } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/lease:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      operationId: resource.lease.get
      description: Returns the active resource lease without its secret owner token, or null when no live lease exists.
      parameters: [{ $ref: '#/components/parameters/ActorIdHeader' }]
      responses:
        "200": { description: Lease status or null, content: { application/json: { schema: { $ref: '#/components/schemas/OptionalLeaseStatus' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
    post:
      operationId: resource.lease.acquire
      description: Replaying while the grant is live returns the original lease grant. Once it expires and no competing lease exists, the same fingerprint may acquire a fresh grant. Reusing the key with different input returns idempotency_conflict.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "200": { description: Lease grant }
        "409": { $ref: '#/components/responses/Problem' }
    put:
      operationId: resource.lease.renew
      description: Replaying the same idempotency key and input returns the original lease receipt without extending expiry again. Reusing a key with a different actor, resource, owner token, or TTL returns idempotency_conflict.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "200": { description: Renewed lease }
        "409": { $ref: '#/components/responses/Problem' }
    delete:
      operationId: resource.lease.release
      description: Replaying the same idempotency key and actor/resource/owner token returns the released receipt, including when the lease is already absent. Reusing a key with different input returns idempotency_conflict.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "200": { description: Released lease }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/manifest:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      operationId: profile.manifest.get
      parameters:
        - { $ref: '#/components/parameters/ActorIdHeader' }
        - name: repairStaleProxy
          in: query
          required: false
          description: Read the active manifest while refreshing a stale proxy revision. Requires profile.read and profile.update; does not authorize launch or commit.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Current durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/OptionalSyncManifest' } } } }
        "403": { $ref: '#/components/responses/Problem', description: Actor header does not match the authenticated account }
    put:
      operationId: profile.manifest.commit
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: x-buglogin-profile-revision
          in: header
          required: false
          description: Required when committing a pending profile proxy assignment; must match the profile revision used to stage it.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/SyncManifest' }
                - { $ref: '#/components/schemas/ResourceManifestKeyRotationInput' }
      responses:
        "200": { description: Committed durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/SyncManifest' } } } }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/profiles/{profileId}/key-rotation-recipients:
    get:
      operationId: profile.keyrotation.recipients.list
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses:
        "200": { description: Active direct and group-share recipient device keys for a pending owner key rotation, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileKeyRotationRecipientDevicesList' } } } }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/blobs:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      operationId: profile.blob.get
      parameters:
        - { $ref: '#/components/parameters/ActorIdHeader' }
        - { name: key, in: query, required: true, schema: { type: string } }
        - name: repairStaleProxy
          in: query
          required: false
          description: Read an object from the active manifest while refreshing only a stale proxy revision. Requires profile.read and profile.update; current proxy access is still checked.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Verified immutable profile blob }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "502": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem', description: Storage is temporarily unavailable, or the shared large-transfer budget is full; retry the request }
    put:
      operationId: profile.blob.put
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: key, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "200": { description: Verified immutable blob receipt }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "413": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem', description: Storage or coordination is temporarily unavailable, or the shared large-transfer budget is full; retry the request }
