        "200": { description: Cookie job state, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectedCookieJob' } } } }
        "403": { $ref: '#/components/responses/Problem' }
        "404": { $ref: '#/components/responses/Problem' }
  /v1/cookie-jobs/{jobId}/claim:
    post:
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
      responses:
        "200": { description: Device-bound job claim, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectedCookieJob' } } } }
