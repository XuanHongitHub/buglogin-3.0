      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - { name: after, in: query, required: false, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, minLength: 1 } }
      responses: { "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }, "409": { $ref: '#/components/responses/Problem' }, "503": { $ref: '#/components/responses/Problem' } }
  /v1/migrations/inspect:
    post:
      operationId: migration.inspect
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationInspectInput' } } } }
      responses: { "202": { description: Migration inspection operation, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } } }
  /v1/migrations/import:
    post:
      operationId: migration.import
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationImportInput' } } } }
      responses: { "202": { description: Migration import operation, content: { application/json: { schema: { $ref: '#/components/schemas/Operation' } } } } }
  /v1/migrations/control/import:
    post:
      operationId: migration.control.import
      description: Requires the migration.write execute capability. dryRun returns a non-mutating plan; otherwise the import activates the validated control graph. Idempotent retries replay the existing package receipt.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ControlImportInput' } } } }
      responses:
        "200": { description: Dry-run plan or activated/replayed import receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ControlImportResult' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
        "409": { $ref: '#/components/responses/Problem' }
        "422": { $ref: '#/components/responses/Problem' }
        "503": { $ref: '#/components/responses/Problem' }
  /v1/migrations/control/rollback:
    post:
      operationId: migration.control.rollback
      description: Requires the migration.write execute capability and exact confirmation ROLLBACK_CONTROL_MIGRATION. Rollback is compare-and-swap guarded and replays an already completed rollback.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ControlRollbackInput' } } } }
      responses:
        "200": { description: Rollback receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ControlImportReceipt' } } } }
