      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      responses:
        "200": { description: "Queued or running jobs for the authenticated device; running jobs remain available for reconciliation after the claim deadline", content: { application/json: { schema: { $ref: '#/components/schemas/ConnectedCookieJobInbox' } } } }
