[package]
name = "buglogin-sync"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
getrandom = "0.3"
buglogin-domain = { path = "../domain" }
buglogin-storage = { path = "../storage" }
redis = { version = "1.4", default-features = false, features = ["connection-manager", "script", "streams", "tokio-rustls-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
redis-tests = []

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"



