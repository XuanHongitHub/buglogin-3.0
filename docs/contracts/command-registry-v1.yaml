version: "1.0"
registryId: buglogin.commands.v1
defaults:
  timeoutMs: 30000
  audit: required
  auth: required
  idempotency: required-for-command-and-long-running-operation
  resultEnvelope: CommandResult
  errorEnvelope: Problem
commands:
  - id: runtime.catalog.get
    kind: query
    capability: CAP-RUN-001
    action: read
    auth: public
    adapters: [rest, mcp]
    input: Empty
    output: RuntimeCatalog
    audit: metadata-only
    idempotency: none
  - id: system.health.get
    kind: query
    capability: system.read
    action: read
    auth: optional-local
    adapters: [tauri, rest, mcp]
    input: Empty
    output: Health
    audit: metadata-only
  - id: feedback.submit
    kind: command
    capability: CAP-DIAG-001
    action: create
    adapters: [tauri, rest]
    input: FeedbackSubmission
    output: FeedbackReceipt
    idempotency: required
  - id: diagnostics.errors.list
    kind: query
    capability: CAP-DIAG-001
    action: read
    adapters: [mcp]
    input: DiagnosticErrorsListInput
    output: DiagnosticErrorPage
    preconditions: [platform-admin-role, automatic-diagnostic-schema-only, bounded-pagination]
    audit: metadata-only
    idempotency: none
  - id: operation.get
    kind: query
    capability: operation.read
    action: read
    adapters: [tauri, rest, mcp]
    input: OperationIdInput
    output: Operation
  - id: events.stream
    kind: subscription
    capability: events.read
    action: read
    adapters: [tauri, rest, mcp]
    input: EventFilterInput
    output: Event
    audit: metadata-only
  - id: audit.events.list
    kind: query
    capability: CAP-AUD-001
    action: read
    adapters: [rest, mcp]
    input: AuditEventsListInput
    output: AuditEventPage
    audit: metadata-only
  - id: profile.list
    kind: query
    capability: profile.read
    action: read
    adapters: [tauri, rest, mcp]
    input: ProfileListInput
    output: ProfilePage
  - id: profile.get
    kind: query
    capability: profile.read
    action: read
    adapters: [tauri, rest, mcp]
    input: ProfileIdInput
    output: ProfileRecord
  - id: profile.viewer.ticket.issue
    kind: command
    capability: profile.read
    action: read
    adapters: [rest]
    input: ProfileIdInput
    output: ProfileViewerTicket
    idempotency: none
  - id: profile.viewer.ticket.redeem
    kind: command
    capability: profile.read
    action: read
    auth: single-use-capability
    adapters: [rest]
    input: ProfileViewerTicketInput
    output: ProfileViewerSessionResponse
    idempotency: none
  - id: profile.binding.get
    kind: query
    capability: profile.read
    action: read
    adapters: [tauri, rest]
    input: ProfileIdInput
    output: ProfileResource
    audit: metadata-only
  - id: profile.create
    kind: command
    capability: profile.create
    action: create
    adapters: [tauri, rest, mcp]
    input: ProfileCreateInput
    output: ProfileRecord
    idempotency: required
  - id: profile.update
    kind: command
    capability: profile.update
    action: update
    adapters: [tauri, rest, mcp]
    input: ProfileUpdateInput
    output: ProfileRecord
    idempotency: required
    preconditions: [active-profile-binding, profile-not-running, expected-revision-current]
  - id: profile.clone
    kind: command
    capability: profile.create
    action: create
    adapters: [tauri, rest, mcp]
    input: ProfileCloneInput
    output: ProfileCloneReceipt
    idempotency: required
    preconditions: [source-profile-readable, source-revision-current, metadata-only]
  - id: profile.share
    kind: command
    capability: CAP-SHARE-001
    action: manage
    adapters: [tauri, rest, mcp]
    input: ProfileShareInput
    output: ProfileShareReceipt
    idempotency: required
    preconditions: [active-workspace-member, profile-revision-current]
  - id: profile.share.revoke
    kind: command
    capability: CAP-SHARE-001
    action: manage
    adapters: [tauri, rest, mcp]
    input: ProfileShareRevokeInput
    output: ProfileShareRevocationReceipt
    idempotency: required
    preconditions: [active-workspace-member, profile-revision-current]
  - id: profile.share.recipientdevicekeys.list
    kind: query
    capability: CAP-SHARE-001
    action: manage
    adapters: [tauri, rest]
    input: ProfileShareRecipientDeviceKeysInput
    output: DeviceEncryptionKeyList
    preconditions: [profile-share-authorized, active-workspace-member, active-device-session]
  - id: profile.share.keyenvelope.get
    kind: query
    capability: CAP-SHARE-001
    action: read
    adapters: [rest]
    input: ProfileIdInput
    output: ProfileKeyShareEnvelope
    preconditions: [active-direct-profile-share, active-device-session, no-key-rotation-pending]
  - id: profile.keyrotation.recipients.list
    kind: query
    capability: profile.update
    action: update
    adapters: [tauri, rest]
    input: ProfileIdInput
    output: ProfileKeyRotationRecipientDevicesList
    preconditions: [profile-update-authorized, rotation-pending, effective-shared-read-or-execute-members, active-device-session, bounded-active-device-key-set]
  - id: profile.keyrotation.execute
    kind: operation
    capability: profile.update
    action: update
    adapters: [tauri]
    input: ProfileKeyRotationExecuteInput
    output: OperationAccepted
    timeoutMs: 120000
    idempotency: required
    events: [operation.updated, profile.runtime.updated]
    preconditions: [profile-update-authorized, rotation-pending, exact-recipient-device-fingerprint-confirmation, active-device-session]
  - id: profile.launch
    kind: operation
    capability: profile.launch
    action: execute
    adapters: [tauri, rest, mcp]
    input: ProfileLaunchInput
    output: OperationAccepted
    timeoutMs: 120000
    idempotency: required
    events: [operation.updated, profile.runtime.updated]
  - id: profile.stop
    kind: operation
    capability: profile.stop
    action: execute
    adapters: [tauri, rest, mcp]
    input: ProfileIdInput
    output: OperationAccepted
    timeoutMs: 60000
    idempotency: required
    events: [operation.updated, profile.runtime.updated]
  - id: runtime.dispatch.enqueue
    kind: command
    capability: CAP-RUN-001
    action: execute
    adapters: [rest]
    input: RuntimeDispatchInput
    output: RuntimeDispatchJobEnvelope
    idempotency: required
    preconditions: [account-authorized-profile, active-target-device-owned-by-account]
  - id: runtime.dispatch.inbox
    kind: query
    capability: CAP-RUN-001
    action: read
    adapters: [rest]
    input: Empty
    output: RuntimeDispatchInbox
    audit: metadata-only
  - id: runtime.dispatch.claim
    kind: command
    capability: CAP-RUN-001
    action: execute
    adapters: [rest]
    input: RuntimeDispatchJobIdInput
    output: RuntimeDispatchJobEnvelope
    idempotency: none
    preconditions: [authenticated-target-device, current-profile-lifecycle-permission]
  - id: runtime.dispatch.complete
    kind: command
    capability: CAP-RUN-001
    action: execute
    adapters: [rest]
    input: RuntimeDispatchReceipt
    output: RuntimeDispatchJobEnvelope
    idempotency: none
    preconditions: [claimed-by-authenticated-target-device, matching-runtime-receipt]
  - id: runtime.dispatch.fail
    kind: command
    capability: CAP-RUN-001
    action: execute
    adapters: [rest]
    input: RuntimeDispatchFailure
    output: RuntimeDispatchJobEnvelope
    idempotency: none
    preconditions: [claimed-by-authenticated-target-device, stable-failure-code]
  - id: profile.sync.recovery.code.get
    kind: query
    capability: profile.read
    action: read
    adapters: [tauri]
    input: ProfileIdInput
    output: ProfileRecoveryCode
    audit: metadata-only
    preconditions: [active-profile-binding, local-profile-key-present]
  - id: profile.sync.recover
    kind: command
    capability: profile.read
    action: read
    adapters: [tauri]
    input: ProfileSyncRecoveryInput
    output: ProfileSyncRecoveryReceipt
    audit: required
    idempotency: required
    preconditions: [active-profile-binding, recovery-code-valid, local-vault-write]
  - id: profile.runtime.get
    kind: query
    capability: profile.read
    action: read
    adapters: [tauri, rest]
    input: ProfileIdInput
    output: OptionalRuntimeProjection
  - id: profile.runtime.started
    kind: command
    capability: profile.update
    action: update
    adapters: [rest]
    input: RuntimeProjectionInput
    output: RuntimeProjection
    idempotency: required
  - id: profile.runtime.stopped
    kind: command
    capability: profile.update
    action: update
    adapters: [rest]
    input: RuntimeProjectionInput
    output: RuntimeProjection
    idempotency: required
  - id: profile.delete
    kind: command
    capability: profile.delete
    action: delete
    adapters: [tauri, rest, mcp]
    input: ProfileDeleteInput
    output: DeleteReceipt
    idempotency: required
    preconditions: [profile-not-running, explicit-data-policy]
  - id: profile.archive
    kind: command
    capability: profile.archive
    action: update
    adapters: [tauri, rest, mcp]
    input: ProfileRevisionInput
    output: ProfileRecord
    idempotency: required
    preconditions: [profile-not-running]
  - id: profile.restore
    kind: command
    capability: profile.restore
    action: update
    adapters: [tauri, rest, mcp]
    input: ProfileRevisionInput
    output: ProfileRecord
    idempotency: required
  - id: cookie.list
    kind: query
    capability: CAP-COOK-001
    action: read
    adapters: [tauri, rest, mcp]
    input: CookieListInput
    output: CookieListResult
    audit: metadata-only
    preconditions: [profile-not-running]
  - id: cookie.jobs.inbox
    kind: query
    capability: CAP-COOK-001
    action: read
    adapters: [rest]
    input: CookieJobInboxInput
    output: ConnectedCookieJobInbox
    audit: metadata-only
    preconditions: [device-session-bound-to-target-device]
  - id: cookie.stage
    kind: command
    capability: CAP-COOK-001
    action: create
    # Cookie values are accepted only by the native OS-vault path. The hosted
    # API exposes device-bound cookie-job routes separately; it must not expose
    # this payload as a generic REST or MCP command.
    adapters: [tauri]
    input: CookieStageInput
    output: CookieStageReceipt
    idempotency: required
  - id: cookie.import
    kind: command
    capability: CAP-COOK-001
    action: create
    # The native adapter resolves the OS-vault stage and enqueues a device job.
    # The generic REST/MCP command boundary cannot access that vault.
    adapters: [tauri]
    input: CookieImportInput
    output: CookieMutationResult
    idempotency: required
    preconditions: [profile-not-running, destination-lease, expected-generation-current, staged-import-one-use]
  - id: cookie.copy
    kind: command
    capability: CAP-COOK-001
    action: create
    # Copy reads and stages cookies on the authorized native device; do not
    # advertise it as a server-side REST/MCP command.
    adapters: [tauri]
    input: CookieCopyInput
    output: CookieMutationResult
    idempotency: required
    preconditions: [source-profile-not-running, destination-profile-not-running, destination-lease, expected-generation-current]
  - id: proxy.parse
    kind: query
    capability: CAP-NET-001
    action: read
    adapters: [tauri, rest, mcp]
    input: ProxyParseInput
    output: ProxyParseReport
    audit: metadata-only
  - id: proxy.import
    kind: command
    capability: CAP-NET-001
    action: create
    adapters: [tauri]
    input: ProxyImportInput
    output: ProxyImportReport
    idempotency: required
    timeoutMs: 120000
    preconditions: [workspace-authorized, credential-stored-in-device-vault]
  - id: proxy.check
    kind: query
    capability: CAP-NET-002
    action: read
    adapters: [tauri]
    input: ProxyCheckInput
    output: ProxyCheckResult
    timeoutMs: 20000
    audit: metadata-only
  - id: proxy.list
    kind: query
    capability: CAP-NET-001
    action: read
    adapters: [tauri, rest, mcp]
    input: ProxyListInput
    output: ProxyPage
    audit: metadata-only
  - id: proxy.get
    kind: query
    capability: CAP-NET-001
    action: read
    adapters: [tauri, rest, mcp]
    input: ProxyIdInput
    output: ProxyRecord
    audit: metadata-only
  - id: proxy.create
    kind: command
    capability: CAP-NET-001
    action: create
    adapters: [tauri, rest, mcp]
    input: ProxyCreateInput
    output: ProxyCreateResult
    idempotency: required
  - id: proxy.update
    kind: command
    capability: CAP-NET-001
    action: update
    adapters: [tauri, rest, mcp]
    input: ProxyUpdateInput
    output: ProxyRecord
    idempotency: required
  - id: proxy.delete
    kind: command
    capability: CAP-NET-001
    action: delete
    adapters: [tauri, rest, mcp]
    input: ProxyDeleteInput
    output: ProxyRecord
    idempotency: required
  - id: migration.inspect
    kind: operation
    capability: migration.read
    action: read
    adapters: [tauri, rest]
    input: MigrationInspectInput
    output: OperationAccepted
    timeoutMs: 300000
    idempotency: required
    events: [operation.updated]
  - id: migration.import
