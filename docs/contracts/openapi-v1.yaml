      - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: workspace.get
      responses: { "200": { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, "404": { $ref: '#/components/responses/Problem' } }
    patch:
      operationId: workspace.update
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdate' } } } }
      responses: { "200": { description: Updated workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, "400": { $ref: '#/components/responses/Problem' }, "404": { $ref: '#/components/responses/Problem' }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/organizations/{organizationId}/workspaces/{workspaceId}/snapshot:
    parameters:
