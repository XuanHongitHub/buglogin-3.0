  /v1/organizations/{organizationId}/workspaces:
    parameters: [{ name: organizationId, in: path, required: true, schema: { type: string, minLength: 1 } }]
    get:
      operationId: workspace.list
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
    post:
      operationId: workspace.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
