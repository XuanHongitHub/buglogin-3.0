      responses: { "200": { description: Deleted team record, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRecord' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/groups:
    parameters: [{ name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }]
