              schema: { $ref: '#/components/schemas/OfflineEntitlement' }
  /v1/workspaces/{workspaceId}/teams:
    parameters: [{ name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }]
    get:
      operationId: team.list
      responses: { "200": { description: Workspace teams with current revisions, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRecordList' } } } } }
    post:
      operationId: team.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
      responses: { "200": { description: Created team record, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRecord' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/teams/{teamId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: team.get
      responses: { "200": { description: Team record, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRecord' } } } }, "404": { $ref: '#/components/responses/Problem' } }
    put:
      operationId: team.update
