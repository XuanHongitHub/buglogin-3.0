      responses: { "200": { description: Created group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupRecord' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/groups/{groupId}:
    parameters:
