              schema: { $ref: '#/components/schemas/OrganizationSnapshot' }
  /v1/organizations/{organizationId}/workspaces/{workspaceId}/usage/check:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, minLength: 1 } }
