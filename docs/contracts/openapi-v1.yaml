      responses: { "200": { description: Deleted group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupRecord' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/members:
    get:
      operationId: member.list
      responses: { "200": { description: Members } }
    post:
      operationId: member.invite
      responses: { "202": { description: Member invitation } }
  /v1/workspaces/{workspaceId}/members/{memberId}:
    get:
      operationId: member.get
      responses: { "200": { description: Member } }
  /v1/workspaces/{workspaceId}/members/{memberId}/activate:
    put:
      operationId: member.activate
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "200":
          description: Activated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
  /v1/workspaces/{workspaceId}/members/{memberId}/suspend:
    put:
      operationId: member.suspend
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        "200":
          description: Suspended member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
  /v1/workspaces/{workspaceId}/members/{memberId}/role:
    put:
      operationId: member.role.update
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberRoleUpdateBody' }
      responses:
        "200":
          description: Updated member role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
  /v1/workspaces/{workspaceId}/resources:
    get:
      operationId: resource.list
      responses: { "200": { description: Resources } }
    post:
      operationId: resource.register
      responses: { "201": { description: Resource } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}:
    get:
      operationId: resource.get
      responses: { "200": { description: Resource } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/lease:
    post:
      operationId: resource.lease.acquire
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Lease grant } }
    put:
      operationId: resource.lease.renew
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Renewed lease } }
    delete:
      operationId: resource.lease.release
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Released lease } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/manifest:
    get:
      operationId: profile.manifest.get
      responses: { "200": { description: Current durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/OptionalSyncManifest' } } } } }
    put:
      operationId: profile.manifest.commit
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: x-buglogin-profile-revision
          in: header
          required: false
          description: Required when committing a pending profile proxy assignment; must match the profile revision used to stage it.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncManifest' }
      responses:
        "200": { description: Committed durable sync manifest, content: { application/json: { schema: { $ref: '#/components/schemas/SyncManifest' } } } }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/blobs:
    get:
      operationId: profile.blob.get
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: Verified immutable profile blob } }
    put:
      operationId: profile.blob.put
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: key, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "200": { description: Verified immutable blob receipt }
        "413": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/blobs/check:
    get:
      operationId: profile.blob.check
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: checksum, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: x-buglogin-owner-id, in: header, required: true, schema: { type: string } }
        - { name: x-buglogin-owner-token, in: header, required: true, schema: { type: string } }
        - { name: x-buglogin-fencing-token, in: header, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Whether the encrypted blob is already staged, content: { application/json: { schema: { $ref: '#/components/schemas/BlobPresence' } } } }
        "409": { $ref: '#/components/responses/Problem' }
  /v1/workspaces/{workspaceId}/grants:
    get:
      operationId: grant.list
      parameters:
        - { name: resourceId, in: query, required: false, schema: { type: string, minLength: 1 } }
        - { name: memberId, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: Workspace grants
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Grant' } }
    post:
      operationId: grant.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }
      responses: { "200": { description: Created grant, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/grants/{grantId}:
    delete:
      operationId: grant.revoke
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { "200": { description: Revoked grant, content: { application/json: { schema: { $ref: '#/components/schemas/GrantRevocationReceipt' } } } }, "404": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/resources/{resourceId}/grants:
    post:
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: resourceId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }
      responses: { "200": { description: Created grant, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }, "403": { $ref: '#/components/responses/Problem' }, "409": { $ref: '#/components/responses/Problem' } }
  /v1/resource-grants/{grantId}:
    delete:
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { "200": { description: Revoked grant, content: { application/json: { schema: { $ref: '#/components/schemas/GrantRevocationReceipt' } } } }, "404": { $ref: '#/components/responses/Problem' } }
  /v1/workspaces/{workspaceId}/audit-events:
    get:
      operationId: audit.events.list
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 280 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Bounded, newest-first audit event page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
        "400": { $ref: '#/components/responses/Problem' }
        "403": { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: opaque-local-token }
    cookieAuth: { type: apiKey, in: cookie, name: __Host-buglogin_session }
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
  responses:
    Problem: { description: Canonical error, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
