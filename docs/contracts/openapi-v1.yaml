      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamUpdateBody' } } } }
      responses: { "200": { description: Updated team record, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRecord' } } } }, "409": { $ref: '#/components/responses/Problem' } }
    delete:
      operationId: team.delete
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
