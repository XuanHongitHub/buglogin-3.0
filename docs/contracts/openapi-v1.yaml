      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUsage' } } } }
      responses: { "200": { description: Usage accepted, content: { application/json: { schema: { $ref: '#/components/schemas/UsageCheckResult' } } } }, "400": { $ref: '#/components/responses/Problem' }, "403": { $ref: '#/components/responses/Problem' } }
  /v1/organizations/{organizationId}/workspaces/{workspaceId}/offline-entitlement:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: workspaceId, in: path, required: true, schema: { type: string, minLength: 1 } }
