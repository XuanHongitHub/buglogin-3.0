services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: buglogin_e2e
      POSTGRES_USER: buglogin_e2e
      POSTGRES_PASSWORD: e2e-only-postgres-password
    ports: ["54321:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buglogin_e2e -d buglogin_e2e"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":59001"
    environment:
      MINIO_ROOT_USER: buglogin_e2e
      MINIO_ROOT_PASSWORD: e2e-only-minio-password
    ports: ["59000:9000", "59001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15
