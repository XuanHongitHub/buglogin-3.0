# Installs Node.js and pnpm, then checks the current BugLogin 3.0 JS surface.

name: Lint Node.js

on:
  workflow_call:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "src-tauri/**"
      - "README.md"
      - ".github/workflows/lint-rs.yml"
      - ".github/workflows/osv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: ./.github/actions/setup-buglogin
        with:
          install-node-dependencies: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run current JavaScript workspace checks
        run: node scripts/ci/check-js.mjs
