name: BugLogin Release Verification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Semantic-version tag to release from the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buglogin-release-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - id: release
        name: Validate release tag from the default branch
        shell: bash
        env:
          INPUT_REF: ${{ inputs.release_ref }}
          CURRENT_REF: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_REF="$INPUT_REF"
          if [[ "$CURRENT_REF_TYPE" != "branch" || "$CURRENT_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release must run from the repository default branch"
            exit 1
          fi
          [[ -n "$RELEASE_REF" ]] || { echo "release_ref is required"; exit 1; }
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
          RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          [[ -n "$RELEASE_SHA" ]] || { echo "Release tag does not resolve to a commit"; exit 1; }
          VERSION="${RELEASE_REF#v}"
          [[ "$(node -p "require('./apps/desktop/package.json').version")" == "$VERSION" ]] || { echo "desktop package version mismatch"; exit 1; }
          [[ "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" == "$VERSION" ]] || { echo "Tauri version mismatch"; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Tracked checkout is dirty"; exit 1; }
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  sign-and-verify:
    needs: validate
    uses: ./.github/workflows/signing.yml
    with:
      source-ref: ${{ needs.validate.outputs.release_ref }}
      source-sha: ${{ needs.validate.outputs.release_sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish-rc:
    needs: [validate, sign-and-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publish
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
      S3_RELEASE_BUCKET: mavelnut-login
      S3_ENDPOINT: https://sgp1.digitaloceanspaces.com
      S3_PUBLIC_BASE_URL: https://mavelnut-login.sgp1.digitaloceanspaces.com/releases/desktop/v3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: buglogin-${{ needs.validate.outputs.release_ref }}-*-signed
          path: incoming
          merge-multiple: false
      - name: Verify platform bundles and prepare immutable RC assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_REF; refusing to replace immutable assets"
            exit 1
          fi
          [[ ! -e "dist-release/$RELEASE_REF" ]] || { echo "Release staging path already exists"; exit 1; }
          mkdir -p "dist-release/$RELEASE_REF"
          expected=(windows-x64 macos-arm64)
          for platform in "${expected[@]}"; do
            matches=(incoming/buglogin-"$RELEASE_REF"-"$platform"-signed)
            [[ -d "${matches[0]}" ]] || { echo "Missing signed artifact for $platform"; exit 1; }
            node scripts/release/verify-bundle.mjs "${matches[0]}"
            (cd "${matches[0]}" && zip -qr "$GITHUB_WORKSPACE/dist-release/$RELEASE_REF/BugLogin-$RELEASE_REF-$platform.zip" .)
          done
          node scripts/release/assemble-tauri-updater-feed.mjs incoming "dist-release/$RELEASE_REF" "${RELEASE_REF#v}" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/$RELEASE_REF/$GITHUB_RUN_ID/"
          node scripts/release/verify-tauri-updater-feed.mjs "dist-release/$RELEASE_REF/latest.json" "${RELEASE_REF#v}" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/"
          node scripts/release/verify-downloads-manifest.mjs "dist-release/$RELEASE_REF/downloads.json" "${RELEASE_REF#v}" "$S3_PUBLIC_BASE_URL/artifacts/"
          [[ "$(find "dist-release/$RELEASE_REF" -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" == 2 ]] || { echo "Expected exactly two supported platform archives"; exit 1; }
          (cd "dist-release/$RELEASE_REF" && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Publish immutable RC artifacts and feed to DigitalOcean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY secret is required}"
          aws --version
          version_prefix="releases/desktop/v3/artifacts/$RELEASE_REF/$GITHUB_RUN_ID"
          for file in "dist-release/$RELEASE_REF"/*; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            content_type=application/octet-stream
            [[ "$name" == *.json ]] && content_type=application/json
            [[ "$name" == *.sig ]] && content_type=text/plain
            aws s3 cp "$file" "s3://$S3_RELEASE_BUCKET/$version_prefix/$name" \
              --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
              --cache-control 'public,max-age=31536000,immutable' --content-type "$content_type"
          done
          aws s3 cp "dist-release/$RELEASE_REF/latest.json" "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/rc/latest.json" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=60' --content-type application/json
          aws s3 cp "dist-release/$RELEASE_REF/downloads.json" "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/rc/downloads.json" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=60' --content-type application/json
          curl --fail --silent --show-error "$S3_PUBLIC_BASE_URL/rc/latest.json" -o downloaded-rc-latest.json
          cmp "dist-release/$RELEASE_REF/latest.json" downloaded-rc-latest.json
          curl --fail --silent --show-error "$S3_PUBLIC_BASE_URL/rc/downloads.json" -o downloaded-rc-downloads.json
          cmp "dist-release/$RELEASE_REF/downloads.json" downloaded-rc-downloads.json
          node scripts/release/verify-tauri-updater-feed.mjs downloaded-rc-latest.json "${RELEASE_REF#v}" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/"
          node -e 'for (const item of Object.values(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).platforms)) console.log(item.url)' downloaded-rc-downloads.json | while IFS= read -r url; do curl --fail --silent --show-error --head --max-time 30 "$url" >/dev/null; done
      - name: Create GitHub draft prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_REF" dist-release/"$RELEASE_REF"/* \
            --prerelease --verify-tag \
            --title "BugLogin $RELEASE_REF (release candidate)" \
            --notes "Signed Windows and macOS release candidate. Verify SHA256SUMS.txt and provenance before promotion. This release is not the stable channel."
