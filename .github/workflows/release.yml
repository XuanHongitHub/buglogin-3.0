name: BugLogin Release Verification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full commit SHA on the default branch (or an existing semantic-version tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buglogin-release-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate source commit from the default branch
        shell: bash
        env:
          INPUT_REF: ${{ inputs.release_ref }}
          CURRENT_REF: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_REF="$INPUT_REF"
          if [[ "$CURRENT_REF_TYPE" != "branch" || "$CURRENT_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release must run from the repository default branch"
            exit 1
          fi
          [[ -n "$RELEASE_REF" ]] || { echo "release_ref is required"; exit 1; }
          if [[ "$RELEASE_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            RELEASE_SHA="$RELEASE_REF"
            [[ "$(git rev-parse "$RELEASE_SHA^{commit}")" == "$RELEASE_SHA" ]] || { echo "Source SHA does not resolve to a commit"; exit 1; }
            git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH" || { echo "Source SHA must be on the default branch"; exit 1; }
            VERSION="$(node -p "require('./apps/desktop/package.json').version")"
            RELEASE_REF="$RELEASE_SHA"
          else
            echo "release_ref must be a full commit SHA or semantic-version tag"
            exit 1
          fi
          [[ -n "$RELEASE_SHA" ]] || { echo "Release ref does not resolve to a commit"; exit 1; }
          [[ "$(node -p "require('./apps/desktop/package.json').version")" == "$VERSION" ]] || { echo "desktop package version mismatch"; exit 1; }
          [[ "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" == "$VERSION" ]] || { echo "Tauri version mismatch"; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Tracked checkout is dirty"; exit 1; }
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  sign-and-verify:
    needs: validate
    uses: ./.github/workflows/signing.yml
    with:
      source-ref: ${{ needs.validate.outputs.release_ref }}
      source-sha: ${{ needs.validate.outputs.release_sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write
