name: Promote BugLogin RC to Stable

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing published RC tag to promote (for example v1.2.3)
        required: true
        type: string
      qa_evidence_url:
        description: HTTPS link to completed Windows/macOS install, update, and sync acceptance evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buglogin-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-promotion
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ inputs.release_ref }}
      QA_EVIDENCE_URL: ${{ inputs.qa_evidence_url }}
      S3_RELEASE_BUCKET: mavelnut-login
      S3_ENDPOINT: https://sgp1.digitaloceanspaces.com
      S3_PUBLIC_BASE_URL: https://mavelnut-login.sgp1.digitaloceanspaces.com/releases/desktop/v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate request and source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable promotion requires a final semantic-version tag"; exit 1; }
          [[ "$QA_EVIDENCE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "QA evidence must be an HTTPS URL"; exit 1; }
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_REF" >/dev/null || { echo "Release tag is missing"; exit 1; }
          RELEASE_JSON="$(gh release view "$RELEASE_REF" --json isDraft,isPrerelease,isLatest,tagName)"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.tagName!==process.env.RELEASE_REF||r.isDraft||(!r.isPrerelease&&!r.isLatest)) process.exit(1)' "$RELEASE_JSON" || { echo "Only a published RC or the already promoted latest release may continue"; exit 1; }
          echo "QA evidence: $QA_EVIDENCE_URL"
      - name: Download and verify immutable RC assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$RELEASE_REF" --dir downloaded
          test -s downloaded/SHA256SUMS.txt
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          node scripts/release/verify-tauri-updater-feed.mjs downloaded/latest.json "${RELEASE_REF#v}" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/"
          count="$(find downloaded -maxdepth 1 -type f -name 'BugLogin-*.zip' | wc -l | tr -d ' ')"
          [[ "$count" == 3 ]] || { echo "Expected the exact Windows and macOS RC archives"; exit 1; }
      - name: Promote existing release metadata without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_REF" --json isPrerelease,isLatest)"
          if node -e 'const r=JSON.parse(process.argv[1]);process.exit(r.isPrerelease?0:1)' "$release_json"; then
            gh release edit "$RELEASE_REF" --prerelease=false --latest
          fi
          RELEASE_JSON="$(gh release view "$RELEASE_REF" --json isDraft,isPrerelease,isLatest,tagName)"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.tagName!==process.env.RELEASE_REF||r.isDraft||r.isPrerelease||!r.isLatest) process.exit(1)' "$RELEASE_JSON"
      - name: Publish stable updater feed to DigitalOcean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY secret is required}"
          aws --version
          aws s3 cp downloaded/latest.json "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/stable/latest.json" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=60' --content-type application/json
          curl --fail --silent --show-error "$S3_PUBLIC_BASE_URL/stable/latest.json" -o stable-latest.json
          cmp downloaded/latest.json stable-latest.json
