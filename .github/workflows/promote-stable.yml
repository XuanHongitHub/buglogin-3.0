name: Publish BugLogin Stable Update Feed

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful BugLogin Release Verification run containing signed Windows and macOS artifacts
        required: true
        type: string
      publication_reason:
        description: Short reason for publishing the stable feed (recorded in the workflow log)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: buglogin-stable-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publish
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      PUBLICATION_REASON: ${{ inputs.publication_reason }}
      S3_RELEASE_BUCKET: mavelnut-login
      S3_ENDPOINT: https://sgp1.digitaloceanspaces.com
      S3_PUBLIC_BASE_URL: https://mavelnut-login.sgp1.digitaloceanspaces.com/releases/desktop/v3
      BUGLOGIN_UPDATER_PUBLIC_KEY_BASE64: ${{ vars.BUGLOGIN_UPDATER_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate successful candidate run and source commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id must be numeric'; exit 1; }
          [[ -n "${PUBLICATION_REASON//[[:space:]]/}" ]] || { echo 'publication_reason is required'; exit 1; }
          RUN_JSON="$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID")"
          SOURCE_SHA="$(node -e 'const r=JSON.parse(process.argv[1]);if(r.status!=="completed"||r.conclusion!=="success"||!r.path.endsWith(".github/workflows/release.yml"))process.exit(1);process.stdout.write(r.head_sha)' "$RUN_JSON")"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$GITHUB_REF_NAME" || { echo 'Candidate source SHA is not on the default branch'; exit 1; }
          VERSION="$(git show "$SOURCE_SHA:apps/desktop/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          TAURI_VERSION="$(git show "$SOURCE_SHA:apps/desktop/src-tauri/tauri.conf.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable publication requires a final semantic version'; exit 1; }
          [[ "$VERSION" == "$TAURI_VERSION" ]] || { echo 'Candidate package and Tauri versions do not match'; exit 1; }
          printf 'source_sha=%s\nversion=%s\n' "$SOURCE_SHA" "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_SHA=%s\nVERSION=%s\n' "$SOURCE_SHA" "$VERSION" >> "$GITHUB_ENV"
          echo "Publishing candidate run $CANDIDATE_RUN_ID from $SOURCE_SHA, version $VERSION"
          echo "Publication reason: $PUBLICATION_REASON"
      - name: Download signed platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming/windows incoming/macos
          gh run download "$CANDIDATE_RUN_ID" --repo "$GH_REPO" --name "buglogin-${SOURCE_SHA}-windows-x64-signed" --dir incoming/windows
          gh run download "$CANDIDATE_RUN_ID" --repo "$GH_REPO" --name "buglogin-${SOURCE_SHA}-macos-arm64-signed" --dir incoming/macos
          node -e 'const fs=require("node:fs");for(const [dir,platform] of [["incoming/windows","windows-x64"],["incoming/macos","macos-arm64"]]){const p=JSON.parse(fs.readFileSync(`${dir}/provenance.json`,`utf8`));if(p.source.repository!==process.env.GH_REPO||p.source.sha!==process.env.SOURCE_SHA||p.source.ref!==process.env.SOURCE_SHA||p.platform!==platform)throw Error(`${platform}: candidate provenance mismatch`)}'
          (cd incoming/windows && sha256sum --check SHA256SUMS.txt)
          (cd incoming/macos && sha256sum --check SHA256SUMS.txt)
          node scripts/release/verify-bundle.mjs incoming/windows
          node scripts/release/verify-bundle.mjs incoming/macos
      - name: Assemble and validate updater and download manifests
        shell: bash
        run: |
          set -euo pipefail
          FEED_INPUT="$(mktemp -d)"
          mkdir -p "$FEED_INPUT/buglogin-v${VERSION}-windows-x64-signed" "$FEED_INPUT/buglogin-v${VERSION}-macos-arm64-signed" assembled
          cp incoming/windows/* "$FEED_INPUT/buglogin-v${VERSION}-windows-x64-signed/"
          cp incoming/macos/* "$FEED_INPUT/buglogin-v${VERSION}-macos-arm64-signed/"
          ARTIFACT_ROOT="$S3_PUBLIC_BASE_URL/artifacts/v${VERSION}/${CANDIDATE_RUN_ID}/"
          node scripts/release/assemble-tauri-updater-feed.mjs "$FEED_INPUT" assembled "$VERSION" "$GH_REPO" "$ARTIFACT_ROOT"
          node scripts/release/verify-tauri-updater-feed.mjs assembled/latest.json "$VERSION" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/"
          node scripts/release/verify-downloads-manifest.mjs assembled/downloads.json "$VERSION" "$ARTIFACT_ROOT"
          mkdir -p assembled/evidence/windows assembled/evidence/macos
          cp incoming/windows/dist.spdx.json incoming/windows/provenance.json incoming/windows/SHA256SUMS.txt assembled/evidence/windows/
          cp incoming/macos/dist.spdx.json incoming/macos/provenance.json incoming/macos/SHA256SUMS.txt assembled/evidence/macos/
          (cd assembled && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Upload immutable artifacts and verify public downloads
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY secret is required}"
          aws s3 sync assembled/ "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/artifacts/v$VERSION/$CANDIDATE_RUN_ID/" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=31536000,immutable'
          node -e 'const fs=require("node:fs");for(const [p,e] of Object.entries(JSON.parse(fs.readFileSync("assembled/latest.json","utf8")).platforms)){const u=new URL(e.url);if(u.protocol!=="https:")throw Error(`${p}: insecure URL`);console.log(u.href)}for(const e of Object.values(JSON.parse(fs.readFileSync("assembled/downloads.json","utf8")).platforms))console.log(new URL(e.url).href)' | while IFS= read -r url; do
            status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --head "$url")"
            [[ "$status" == 200 ]] || { echo "Public artifact HEAD returned $status: $url"; exit 1; }
          done
      - name: Publish stable JSON and confirm app and landing reads
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 cp assembled/latest.json "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/stable/latest.json" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=60' --content-type application/json
          aws s3 cp assembled/downloads.json "s3://$S3_RELEASE_BUCKET/releases/desktop/v3/stable/downloads.json" \
            --endpoint-url "$S3_ENDPOINT" --region sgp1 --acl public-read \
            --cache-control 'public,max-age=60' --content-type application/json
          curl --fail --silent --show-error "$S3_PUBLIC_BASE_URL/stable/latest.json" -o stable-latest.json
          curl --fail --silent --show-error "$S3_PUBLIC_BASE_URL/stable/downloads.json" -o stable-downloads.json
          cmp assembled/latest.json stable-latest.json
          cmp assembled/downloads.json stable-downloads.json
          node scripts/release/verify-tauri-updater-feed.mjs stable-latest.json "$VERSION" "$GH_REPO" "$S3_PUBLIC_BASE_URL/artifacts/"
          node scripts/release/verify-downloads-manifest.mjs stable-downloads.json "$VERSION" "$S3_PUBLIC_BASE_URL/artifacts/v$VERSION/$CANDIDATE_RUN_ID/"
          LANDING_HEADERS="$(mktemp)"
          LANDING_BODY="$(mktemp)"
          LANDING_STATUS="$(curl --silent --show-error --output "$LANDING_BODY" --dump-header "$LANDING_HEADERS" --write-out '%{http_code}' https://app3.buglogin.com/api/downloads/latest || true)"
          if [[ "$LANDING_STATUS" == 200 ]]; then
            node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(d.version!==process.argv[2])throw Error(`landing version ${d.version} != ${process.argv[2]}`);for(const p of ["windows","macos"]){const u=new URL(d.platforms?.[p]?.url);if(!u.href.startsWith(process.argv[3]))throw Error(`${p}: unexpected landing URL`)}' "$LANDING_BODY" "$VERSION" "$S3_PUBLIC_BASE_URL/artifacts/v$VERSION/$CANDIDATE_RUN_ID/"
          elif [[ "$LANDING_STATUS" == 403 ]] && grep -qi '^cf-mitigated: challenge' "$LANDING_HEADERS" && grep -qi '^server: cloudflare' "$LANDING_HEADERS" && grep -qi '^cf-ray:' "$LANDING_HEADERS"; then
            echo '::warning::Cloudflare challenge blocks the GitHub-hosted runner; the stable S3 feed was verified above. Verify the landing endpoint from a normal client.'
          else
            echo "Landing download endpoint returned HTTP $LANDING_STATUS"
            cat "$LANDING_BODY"
            exit 1
          fi
