name: BugLogin Contracts

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "docs/contracts/**"
      - "docs/capabilities/registry.md"
      - "docs/agents/work-packet-ownership.md"
      - "docs/architecture/upstream-baseline-manifest.yaml"
      - "scripts/ci/**"
      - ".github/workflows/contracts.yml"
      - ".github/actions/setup-buglogin/**"
  pull_request:
    paths:
      - "docs/contracts/**"
      - "docs/capabilities/registry.md"
      - "docs/agents/work-packet-ownership.md"
      - "docs/architecture/upstream-baseline-manifest.yaml"
      - "scripts/ci/**"
      - ".github/workflows/contracts.yml"
      - ".github/actions/setup-buglogin/**"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buglogin
        with:
          install-node-dependencies: true
      - name: Validate contract documents and workflow YAML
        run: node scripts/ci/check-contracts.mjs
      - name: Validate PR secret boundary
        run: node scripts/ci/check-secret-boundaries.mjs
      - name: Validate shell syntax
        shell: bash
        run: bash -n scripts/ci/check-rust.sh
