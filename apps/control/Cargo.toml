[package]
name = "buglogin-control-app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = "0.8"
buglogin-api = { path = "../../crates/api" }
buglogin-browser = { path = "../../crates/browser" }
buglogin-domain = { path = "../../crates/domain" }
buglogin-storage = { path = "../../crates/storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "buglogin-control"
path = "src/main.rs"

