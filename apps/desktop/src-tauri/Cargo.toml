[package]
name = "buglogin-desktop-app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
buglogin-api = { path = "../../../crates/api" }
buglogin-browser = { path = "../../../crates/browser" }
buglogin-domain = { path = "../../../crates/domain" }
buglogin-migration = { path = "../../../crates/migration" }
buglogin-network = { path = "../../../crates/network" }
buglogin-storage = { path = "../../../crates/storage" }
buglogin-sync = { path = "../../../crates/sync" }
async-trait = "0.1"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
argon2 = "0.5"
data-encoding = "2.11"
hmac = "0.13"
sha1 = "0.11"
time = { version = "0.3", features = ["formatting"] }
base64 = "0.22"
native-tls = "0.2"
tokio-native-tls = "0.3"
url = "2.5"
tokio = { version = "1.53", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "zip"] }
image = "0.25"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json", "http2", "query", "stream"] }
futures-util = "0.3"
getrandom = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
zeroize = "1.8.1"
rusqlite = { version = "0.40", features = ["bundled"] }
aes = "0.8.4"
cbc = "0.1.2"
ring = "0.17.14"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
